name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit + API tests
        run: npm test
      - name: Browser end-to-end
        run: |
          npm i -g playwright@1.56.0
          npx playwright install --with-deps chromium
          NODE_PATH=$(npm root -g) npm run test:e2e && NODE_PATH=$(npm root -g) npm run test:solo
      - name: Docker build
        run: docker build -t fyzio:ci .
