# Fly.io config — Mumbai region (bom) keeps data in India. Change `app` to your chosen name.
app = "fyzio-demo"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/fyzio.sqlite"
  TRUST_PROXY = "true"
  PAYMENT_PROVIDER = "razorpay"
  # Set PUBLIC_URL, APP_NAME, ADMIN_IDENTIFIER, NOTIFY_PROVIDER, RAZORPAY_* etc. with `fly secrets set`.

[[mounts]]
  source = "fyzio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # SQLite + sessions live on this one machine; keep it running
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
